name: Update RSS feeds

on:
  schedule:
    - cron: "17 */2 * * *"  # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python .github/scripts/fetch_feeds.py

      - name: Commit changes
        run: |
          if git diff --quiet -- feeds.json && git ls-files --error-unmatch feeds.json >/dev/null 2>&1; then
            echo "feeds.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git commit -m "Update RSS feeds"
          git push
